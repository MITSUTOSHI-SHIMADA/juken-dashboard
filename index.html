<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Content Security Policy（多層防御） -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light" />

    <title>大学受験マネジメント — ダッシュボード</title>
    <meta name="description" content="家族で使う大学受験版プロジェクトマネージャー" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- フラッシュメッセージ -->
    <div id="flash" class="flash" role="status" aria-live="polite"></div>

    <!-- アプリ全体（ロック解除後に表示） -->
    <div id="app" class="app-layout" hidden>
      <aside class="sidebar" id="sidebar" aria-label="メニュー">
        <div class="sidebar__brand">
          <span class="sidebar__brand-icon">🎓</span>
          <span class="sidebar__brand-text">受験ダッシュボード</span>
        </div>
        <nav class="sidebar__nav" id="sidebar-nav" role="navigation"></nav>
        <div class="sidebar__bottom">
          <div class="role-toggle" id="role-toggle"></div>
          <button class="lock-btn" type="button" data-action="lock" hidden id="lock-btn">
            <span aria-hidden="true">🔒</span> ロック
          </button>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <button class="topbar__menu" type="button" data-action="toggle-sidebar" aria-label="メニューを開く">☰</button>
          <h1 class="page-title" id="page-title">ダッシュボード</h1>
          <div class="topbar__actions" id="topbar-actions"></div>
        </header>
        <div class="page-content" id="page-content"></div>
        <footer class="page-foot">
          このアプリのデータは、お使いの端末ブラウザ内（localStorage）のみに保存されます。
          外部にデータは送信されません。
        </footer>
      </main>
    </div>

    <!-- 鍵モーダル（パスコード入力 / 設定 / リセット） -->
    <div id="lock-screen" class="lock-screen" hidden>
      <div class="lock-card">
        <div class="lock-icon" aria-hidden="true">🔐</div>
        <h2 class="lock-title" id="lock-title">パスコードを入力</h2>
        <p class="lock-desc" id="lock-desc">家族専用の合言葉です</p>
        <form id="lock-form" autocomplete="off">
          <input
            id="lock-input"
            type="password"
            inputmode="text"
            class="lock-input"
            placeholder="••••••"
            aria-label="パスコード"
            autocomplete="off"
            autofocus
          />
          <input
            id="lock-input2"
            type="password"
            inputmode="text"
            class="lock-input"
            placeholder="もう一度入力"
            aria-label="パスコード確認"
            autocomplete="off"
            hidden
          />
          <p class="lock-err" id="lock-err" role="alert"></p>
          <button class="btn btn--primary lock-submit" type="submit" id="lock-submit">ロック解除</button>
        </form>
        <div class="lock-meta" id="lock-meta"></div>
      </div>
    </div>

    <!-- 汎用モーダル（編集・確認ダイアログ用） -->
    <div id="modal" class="modal" hidden>
      <div class="modal__overlay" data-action="modal-close"></div>
      <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal__head">
          <h3 class="modal__title" id="modal-title"></h3>
          <button class="modal__close" type="button" data-action="modal-close" aria-label="閉じる">✕</button>
        </div>
        <div class="modal__body" id="modal-body"></div>
        <div class="modal__foot" id="modal-foot"></div>
      </div>
    </div>

    <script src="data.js"></script>
    <script src="security.js"></script>
    <script src="app.js"></script>
  </body>
</html>
